<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        nav{
            background-color: antiquewhite;
            text-align: center;
            color:blue;
            display: flex;
            
        }
        a{
            text-decoration: none;
            padding:10px;
            transition:all 0.5s;
        }

         nav a:hover {
            color:aquamarine;
            font-size: larger;
            text-decoration: underline;
            transform: scale(1);
        }
    </style>
</head>
<body>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
        <a href="#">Help</a>
    </nav>
</body>
</html>
