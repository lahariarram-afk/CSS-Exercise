<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        .header img {
            width: 80px;
            height: 80px;
        }

        .menu {
            display: flex;
            gap: 20px;
        }

        .menu a {
            color: rgb(139, 48, 48);
            text-decoration: none;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
            animation: fadeIn 2s ease-in-out;
        }

        .hero h1 {
            margin-bottom: 20px;
        }

        .hero button {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            background: blue;
            color: white;
            cursor: pointer;
            transition: all 0.5s;
        }

        .hero button:hover {
            background: green;
            transform: scale(1.1);
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 40px;
            flex-wrap: wrap;
        }

        .card {
            width: 250px;
            padding: 20px;
            background: #f4f4f4;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            margin-bottom: 10px;
        }

        footer {
            background: #003366;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media(max-width:768px) {

            .header {
                flex-direction: column;
                text-align: center;
            }

            .menu {
                flex-direction: column;
                margin-top: 15px;
                gap: 10px;
            }

            .features {
                flex-direction: column;
                align-items: center;
            }

            .card {
                width: 90%;
            }
        }
    </style>
</head>

<body>
    <section class="header">
        <img src="image3.jpg" alt="logo">
        <div class="menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </section>
    <section class="hero">
        <h1>Welcome to Student Management System</h1>
        <button>Register Now</button>
    </section>

    <section class="features">
        <div class="card">
            <h2>Student Registration</h2>
            <p>Add and manage student records easily.</p>
        </div>

        <div class="card">
            <h2>Attendance</h2>
            <p>Track daily attendance efficiently.</p>
        </div>

        <div class="card">
            <h2>Results</h2>
            <p>View and manage examination results.</p>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Student Management System</p>
    </footer>
</body>

</html>
