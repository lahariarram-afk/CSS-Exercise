<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .signal {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background: #635e5e;
            padding: 20px;
            border-radius: 10px;
            width: 100px;
            margin: 50px auto;
        }


        .redlight {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            opacity: 0.3;
            animation: light 6s infinite;
            background-color: red;
            animation-delay: 0s;
        }

        .yellowlight {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            opacity: 0.3;
            animation: light 6s infinite;
            background-color: yellow;
            animation-delay: 2s;
        }

        .greenlight {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            opacity: 0.3;
            animation: light 6s infinite;
            background-color: green;
            animation-delay: 4s;
        }

        @keyframes light {
            0% {
                opacity: 1;
            }

            25% {
                opacity: 0.3;
            }

            100% {
                opacity: 0.3;
            }
        }
    </style>
</head>

<body>
    <div class="signal">
        <div class="redlight"></div>
        <div class="yellowlight"></div>
        <div class="greenlight"></div>
    </div>
</body>

</html>
