<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .btn {
            background-color: blue;
            transition: all 0.5s;
            padding:10px;
            margin:20px;
            cursor: pointer;
        }
        .btn:hover{
            background-color: green;    
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <button class="btn">Click</button>
</body>
</html>
