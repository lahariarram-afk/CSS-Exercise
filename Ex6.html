<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card {
            width:200px;
            height:200px;
            background-color: antiquewhite;
            transition: all 0.5s;
            padding:20px;
            margin:50px;
        }
        .card:hover {
            width:250px;
            height:250px;
            background-color: aquamarine;
            padding:20px;
            margin:50px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Item1</h1>
        <h1>Item2</h1>
        <h1>Item3</h1>
    </div>
</body>
</html>
